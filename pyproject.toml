[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sempred"
version = "0.1.0"
description = "Local semantic predicate scoring for Python and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.scripts]
sempred = "sempred.cli:main"
sempred-train-nli = "training.finetune_nli:main"

[project.optional-dependencies]
nli = [
  "torch>=2.6",
  "transformers>=4.50,<5",
  "safetensors>=0.4",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
]
ml = [
  "torch>=2.6",
  "transformers>=4.50,<5",
  "datasets>=2.20",
]
duckdb = ["duckdb>=1.0", "pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.6", "duckdb>=1.0", "pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["sempred*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
